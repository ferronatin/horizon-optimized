schema = 1
id = "optimized_light"
name = "Horizon Luz Rápida"
version = "1.0.0"
api = "0.1"
description = "Céu quente e cores do terreno ajustadas nas passagens existentes, sem pós-processamento."
authors = ["Horizon Optimized"]
license = "MIT"

[sky]
file = "sky.wgsl"
name = "Céu quente"

[material]
file = "material.wgsl"
name = "Luz e cores do terreno"

[[options]]
id = "warmth"
name = "Luz quente"
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturação"
type = "float"
default = 1.08
min = 0.0
max = 2.0
step = 0.05

[budget]
gpu_ms = 1.0
